<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartEstoque - Entrar</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2e7d32" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SmartEstoque" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="pagina-login">
  <div class="login-tela">
    <section class="login-painel" aria-hidden="true">
      <div class="login-painel-marca">
        <span class="login-painel-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L20 8H6"/><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>
        </span>
        <strong>SmartEstoque</strong>
      </div>
      <h1>Gestão simples.<br />Estoque sob controle.</h1>
      <p>Vendas, produtos e relatórios do seu mercado em um só lugar.</p>

      <div class="login-painel-grafico">
        <svg viewBox="0 0 220 140" fill="none" aria-hidden="true">
          <rect x="14" y="70" width="46" height="50" rx="6" fill="rgba(255,255,255,0.14)" />
          <rect x="70" y="46" width="46" height="74" rx="6" fill="rgba(255,255,255,0.22)" />
          <rect x="126" y="30" width="46" height="90" rx="6" fill="rgba(255,255,255,0.16)" />
          <rect x="182" y="58" width="30" height="62" rx="6" fill="rgba(255,255,255,0.12)" />
          <path d="M14 120h198" stroke="rgba(255,255,255,0.35)" stroke-width="2" stroke-linecap="round" />
        </svg>
      </div>
    </section>

    <section class="login-form-area">
      <div class="login-card">
        <div class="login-card-cabecalho">
          <span class="login-card-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 12.4a2 2 0 0 0 2 1.6h7.2a2 2 0 0 0 2-1.6L20 8H6"/><circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/></svg>
          </span>
          <strong>SmartEstoque</strong>
          <p>Acesse sua conta</p>
        </div>

        <form id="form-login" novalidate>
          <div id="login-erro" class="modal-erro" role="alert" hidden></div>

          <div class="campo-login">
            <label for="email">E-mail ou usuário</label>
            <input type="text" id="email" name="email" autocomplete="username" required autofocus />
          </div>

          <div class="campo-login">
            <label for="senha">Senha</label>
            <div class="campo-senha">
              <input type="password" id="senha" name="senha" autocomplete="current-password" required />
              <button type="button" id="btn-mostrar-senha" aria-label="Mostrar senha" aria-pressed="false">
                <svg class="icone-mostrar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="icone-ocultar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-6.5 0-10-7-10-7a18.6 18.6 0 0 1 4.22-5.06M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><path d="M2 2l20 20"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn login-btn-entrar" id="btn-entrar">Entrar</button>
        </form>
      </div>
    </section>
  </div>

  <script src="/js/login.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
