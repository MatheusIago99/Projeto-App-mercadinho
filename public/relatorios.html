<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartEstoque - Relatórios</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2e7d32" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SmartEstoque" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topo">
    <div class="marca">
      <span class="logo-icone" aria-hidden="true">📊</span>
      <div>
        <h1>Relatórios</h1>
        <span>Vendas e desperdício dos últimos 14 dias</span>
      </div>
    </div>
    <button type="button" id="btn-instalar" hidden>Instalar app</button>
  </header>

  <main>
    <div id="mensagens"></div>

    <section class="card">
      <h2>Faturamento</h2>
      <div class="stat-destaque" id="stat-faturamento">R$ 0,00</div>
      <div id="grafico-faturamento" class="vazio">Carregando...</div>
    </section>

    <section class="card">
      <h2>Produtos mais vendidos</h2>
      <div id="grafico-mais-vendidos" class="vazio">Carregando...</div>
    </section>

    <section class="card">
      <h2>Desperdício</h2>
      <div class="resumo-desperdicio" id="resumo-desperdicio"></div>
      <div id="lista-descartes" class="vazio">Carregando...</div>
    </section>
  </main>

  <nav class="rodape">
    <a href="/index.html"><span class="icone">🏠</span>Início</a>
    <a href="/produtos.html"><span class="icone">📦</span>Produtos</a>
    <a href="/vendas.html"><span class="icone">🛒</span>Vendas</a>
    <a href="/relatorios.html" class="ativo"><span class="icone">📊</span>Relatórios</a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/relatorios.js"></script>
  <script src="/js/pwa.js"></script>
</body>
</html>
