<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartEstoque - Produtos</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="topo">
    <div>
      <h1>Produtos</h1>
      <span>Cadastro e controle de estoque</span>
    </div>
  </header>

  <main>
    <div id="mensagens"></div>

    <section class="card">
      <h2 id="titulo-form">Novo produto</h2>
      <form id="form-produto">
        <input type="hidden" id="produto-id" />
        <label for="nome">Nome</label>
        <input type="text" id="nome" required />

        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" placeholder="Ex: Bebidas, Limpeza..." />

        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" step="0.01" min="0" required />

        <label for="quantidade">Quantidade em estoque</label>
        <input type="number" id="quantidade" min="0" required />

        <label for="estoque_minimo">Estoque mínimo</label>
        <input type="number" id="estoque_minimo" min="0" required />

        <label for="validade">Validade (opcional)</label>
        <input type="date" id="validade" />

        <button type="submit" class="btn" id="btn-salvar">Salvar produto</button>
        <button type="button" class="btn secundario" id="btn-cancelar" style="display:none">Cancelar edição</button>
      </form>
    </section>

    <section class="card">
      <h2>Produtos cadastrados</h2>
      <div id="lista-produtos" class="vazio">Carregando...</div>
    </section>
  </main>

  <nav class="rodape">
    <a href="/index.html"><span class="icone">🏠</span>Início</a>
    <a href="/produtos.html" class="ativo"><span class="icone">📦</span>Produtos</a>
    <a href="/vendas.html"><span class="icone">🛒</span>Vendas</a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/produtos.js"></script>
</body>
</html>
