<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartEstoque</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2e7d32" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SmartEstoque" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <img src="/icons/icon-192.png" alt="" class="splash-icone" />
    <span class="splash-nome">SmartEstoque</span>
  </div>

  <header class="topo">
    <div class="marca">
      <span class="logo-icone" aria-hidden="true"></span>
      <div>
        <h1>SmartEstoque</h1>
        <span>Mini Mercado Bom Gosto</span>
      </div>
    </div>
  </header>

  <main class="main-largo">
    <div id="mensagens"></div>

    <section class="dash-cabecalho">
      <h2>Olá, Administrador!</h2>
      <p>Aqui está o resumo do seu mercadinho hoje.</p>
    </section>

    <section class="kpi-grid" id="kpi-grid" aria-label="Indicadores do dia"></section>

    <section id="atencao-necessaria"></section>

    <section class="desempenho-grid">
      <div class="card">
        <div class="card-cabecalho">
          <h2>Vendas dos últimos 7 dias</h2>
        </div>
        <div class="stat-destaque" id="stat-faturamento-7d"></div>
        <div id="grafico-vendas-7d"></div>
      </div>

      <div class="card">
        <div class="card-cabecalho">
          <h2>Produtos mais vendidos</h2>
        </div>
        <div id="ranking-mais-vendidos"></div>
      </div>
    </section>

    <section class="card">
      <div class="card-cabecalho">
        <h2>Movimentações recentes</h2>
      </div>
      <div id="lista-movimentacoes"></div>
    </section>
  </main>

  <script src="/js/layout.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/splash.js"></script>
</body>
</html>
