<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartEstoque</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2e7d32" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SmartEstoque" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="splash" class="splash" aria-hidden="true">
    <img src="/icons/icon-192.png" alt="" class="splash-icone" />
    <span class="splash-nome">SmartEstoque</span>
  </div>

  <header class="topo">
    <div class="marca">
      <span class="logo-icone" aria-hidden="true">🛒</span>
      <div>
        <h1>SmartEstoque</h1>
        <span>Mini Mercado Bom Gosto</span>
      </div>
    </div>
    <button type="button" id="btn-instalar" hidden>Instalar app</button>
  </header>

  <main>
    <div id="mensagens"></div>

    <section class="card">
      <h2>Estoque mínimo</h2>
      <div id="lista-estoque-baixo" class="vazio">Carregando...</div>
    </section>

    <section class="card">
      <h2>Produtos vencidos</h2>
      <div id="lista-vencidos" class="vazio">Carregando...</div>
    </section>

    <section class="card">
      <h2>Próximos da validade (7 dias)</h2>
      <div id="lista-proximos" class="vazio">Carregando...</div>
    </section>
  </main>

  <nav class="rodape">
    <a href="/index.html" class="ativo"><span class="icone">🏠</span>Início</a>
    <a href="/produtos.html"><span class="icone">📦</span>Produtos</a>
    <a href="/vendas.html"><span class="icone">🛒</span>Vendas</a>
    <a href="/relatorios.html"><span class="icone">📊</span>Relatórios</a>
  </nav>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/pwa.js"></script>
  <script src="/js/splash.js"></script>
</body>
</html>
